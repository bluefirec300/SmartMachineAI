[MACHINE]
name = MMG Smart Factory

[DATA_SOURCE]
driver = simulator
scan_interval = 2

[FINS]
ip = 192.168.0.20
port = 9600
plc_node = 20
pc_node = 18

[OPCUA]
endpoint = opc.tcp://192.168.0.30:4840

[DATABASE]
path = database/machine_data.db
retention_days = 90

[HISTORIAN_MAINTENANCE]
retention_check_interval_hours = 24
# Backup readiness follow-up (2026-08-19) - the backup MECHANISM is
# implemented and tested, but automatic execution is deliberately
# DISABLED BY DEFAULT: this VM has limited disk headroom relative to
# the live historian's size, and a 7-backup rotation of a multi-GB
# database would consume substantial additional space. Retention
# (historian row cleanup, above) is unaffected and stays active - only
# backup is gated. Flip to true only once the destination has been
# confirmed to have real headroom (expanded VM disk, another mounted
# filesystem, etc.) - see database/backup_status.py for a live
# readiness/capacity readout before doing so.
backup_enabled = false
backup_interval_hours = 24
backup_destination_dir = backups
backup_retention_count = 7
# Conservative disk-space safety margin required ON TOP OF the ~2x-
# database-size working capacity every backup attempt already budgets
# for (see database.backup.check_backup_preflight()'s docstring for
# the full formula) - never just "enough room for the backup file
# itself".
backup_minimum_free_reserve_gb = 5

[AI]
provider = ollama
model = gpt-5.5

[OLLAMA]
url = http://localhost:11434
model = qwen2.5:7b
