[MACHINE]
name = MMG Smart Factory

[DATA_SOURCE]
driver = simulator
scan_interval = 2

[FINS]
ip = 192.168.0.20
port = 9600
plc_node = 20
pc_node = 18

[OPCUA]
endpoint = opc.tcp://192.168.0.30:4840

[DATABASE]
path = database/machine_data.db
retention_days = 90

[HISTORIAN_MAINTENANCE]
retention_check_interval_hours = 24
# Phase V1.2 (2026-08-21) - re-confirmed real headroom on this VM (35GB
# free vs. ~11.5GB required for one backup cycle at current database
# sizes - see database/backup_status.py for a live readout) and enabled
# automatic backup for real. Also, from this phase onward, historian
# retention itself no longer lets the live database grow unbounded
# between backups (see database/historian_archive.py) - raw data older
# than retention_days is archived to its own verified monthly file and
# removed from the live table, not just deleted, so the multi-GB growth
# that originally motivated keeping backup disabled is now bounded.
backup_enabled = true
backup_interval_hours = 24
backup_destination_dir = backups
backup_retention_count = 7
# Conservative disk-space safety margin required ON TOP OF the ~2x-
# database-size working capacity every backup attempt already budgets
# for (see database.backup.check_backup_preflight()'s docstring for
# the full formula) - never just "enough room for the backup file
# itself".
backup_minimum_free_reserve_gb = 5

[AI]
provider = ollama
model = gpt-5.5

[OLLAMA]
url = http://localhost:11434
model = qwen2.5:7b
